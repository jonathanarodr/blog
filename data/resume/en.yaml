experience:
  - company: PicPay
    logo: /images/brands/picpay.svg
    url: https://picpay.com
    roles:
      - title: Staff Software Engineer
        start: 2024-12
        summary: As a Staff Software Engineer specializing in Android development, I am part of the Tech Core team with a strong focus on the Design System. I play a key role in the strategic evolution of the Android codebase, leading large-scale modernization initiatives such as the migration from XML to Jetpack Compose and driving observability improvements to enhance platform reliability and end-user experience.
        highlights:
          - Led the evolution and modernization of the Android Design System, owning the end-to-end migration strategy from XML to Jetpack Compose — design documents, architectural guidelines and best practices for scalability, performance and visual consistency. The new Design System reduced the library codebase size by ~65%, improving development efficiency, delivery speed and long-term maintainability.
          - Designed and implemented a custom Image Loader with an abstraction layer for a complex multi-module environment, enabling major version upgrades without manual changes across dependent modules. Integrated Dynatrace for HTTP failure observability, introduced client-side caching and improved production incident visibility.
        skills: [Kotlin, Android, Jetpack Compose, Design System, Dynatrace, Modularization]

