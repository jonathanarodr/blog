{{- /* Context: dict "page" "featured". */ -}}
{{- $p := .page }}
{{- $tags := apply ($p.Params.tags | default slice) "urlize" "." }}
<article class="post-card{{ if .featured }} post-card--featured{{ end }}"
  data-post
  data-tags="{{ delimit $tags " " }}"
  data-search="{{ lower (printf "%s %s" $p.Title ($p.Description | default $p.Summary | plainify)) }}">
  <a class="post-card__link" href="{{ $p.RelPermalink }}">
    {{- partial "jr/cover.html" $p }}
    <h3 class="post-card__title" style="view-transition-name: title-{{ $p.File.ContentBaseName | anchorize }}">{{ $p.Title }}</h3>
  </a>
  {{- partial "jr/byline.html" $p }}
</article>
