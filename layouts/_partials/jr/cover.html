{{- /* Cover: front matter `image` when present, otherwise a typographic cover tinted per page. Context: page. */ -}}
{{- $vt := partial "jr/vt-name.html" (dict "page" . "part" "cover") }}
{{- with .Params.image }}
  <div class="cover" style="view-transition-name: {{ $vt }}">
    <img src="{{ . | relURL }}" alt="" loading="lazy" decoding="async" />
  </div>
{{- else }}
  {{- $hue := mod (hash.FNV32a .Title) 360 }}
  <div class="cover cover--generated" style="--hue: {{ $hue }}; view-transition-name: {{ $vt }}" aria-hidden="true">
    <span class="cover__title">{{ .Title }}</span>
  </div>
{{- end }}
