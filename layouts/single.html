{{ define "main" }}
<article class="page">
  <div class="container container--narrow">
    <header class="page__header">
      <h1 class="display page__title">{{ .Title }}</h1>
      {{- with .Description }}<p class="post__lead">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
