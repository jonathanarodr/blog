{{ define "main" }}
<div class="container not-found">
  <p class="not-found__code">404</p>
  <h1 class="display not-found__title">{{ T "notFoundHeading" }}</h1>
  <p class="hub__lead">{{ T "notFoundText" }}</p>
  <div class="hero__actions hero__actions--center">
    <a class="button button--primary" href="{{ "/" | relLangURL }}">{{ T "backHome" }}</a>
    {{- with site.GetPage "/blog" }}<a class="button" href="{{ .RelPermalink }}">{{ T "goToBlog" }}</a>{{ end }}
  </div>
</div>
{{ end }}
