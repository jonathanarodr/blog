{{ define "main" }}
<div class="container hub">
  {{- partial "jr/hub-header.html" (dict "page" .) }}
  {{- with .Content }}<div class="prose hub__intro enter" style="--enter-step: 1">{{ . }}</div>{{ end }}
  <div class="hub__grid enter" style="--enter-step: 2">
    {{- range .RegularPages }}{{ partial "jr/card.html" (dict "page" .) }}{{ end }}
  </div>
</div>
{{ end }}
