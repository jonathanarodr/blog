# Hugo configuration file
baseURL: https://jonathan-rodrigues.github.io/
title: Jonathan Rodrigues
languageCode: pt-br
defaultContentLanguage: pt

# Enable Git info for last modified dates
enableGitInfo: true

# Import Hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # Allow raw HTML
  goldmark:
    renderer:
      unsafe: true

  # Enable Hextra syntax highlight
  highlight:
    noClasses: false

# Menu configuration
menu:
  main:
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 1
    - identifier: projects
      name: Projetos
      pageRef: /projects
      weight: 2
    - identifier: about
      name: Sobre
      pageRef: /about
      weight: 3
    - name: Buscar
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/jonathanarodr"
      params:
        icon: github
    - name: LinkedIn
      weight: 6
      url: "https://linkedin.com/in/jonathanarodr"
      params:
        icon: linkedin
    - name: Tema
      weight: 7
      params:
        type: theme-toggle

# Site parameters
params:
  # Navbar configuration
  navbar:
    displayTitle: true
    displayLogo: false

  # Footer configuration
  footer:
    displayCopyright: true
    displayPoweredBy: false

  # Theme settings
  theme:
    default: system
    displayToggle: true

  # Page layout
  page:
    width: normal

  # Blog settings
  blog:
    list:
      displayTags: true

  # Date format
  dateFormat: "2 de January de 2006"

  # Edit URL disabled
  editURL:
    enable: false
