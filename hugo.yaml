# Hugo configuration file
baseURL: https://www.jonathanarodr.com/
title: Jonathan Rodrigues
languageCode: pt-br
defaultContentLanguage: pt

# Enable Git info for last modified dates
enableGitInfo: true

# Tags drive the blog hub filter, so no standalone taxonomy pages
disableKinds:
  - taxonomy
  - term

markup:
  # Allow raw HTML
  goldmark:
    renderer:
      unsafe: true

  # Syntax highlight via CSS classes (assets/css/jr-chroma.css)
  highlight:
    noClasses: false

# Menu configuration
menu:
  main:
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 1
    - identifier: projects
      name: Projetos
      pageRef: /projects
      weight: 2
    - identifier: about
      name: Sobre
      pageRef: /about
      weight: 3
    - name: GitHub
      weight: 5
      url: "https://github.com/jonathanarodr"
      params:
        icon: github
    - name: LinkedIn
      weight: 6
      url: "https://linkedin.com/in/jonathanarodr"
      params:
        icon: linkedin

# Site parameters
params:
  # Author shown on blog posts
  author:
    name: Jonathan Rodrigues
    image: https://github.com/jonathanarodr.png
    bio: Mobile software engineer no PicPay. Escrevo sobre Android, Kotlin e carreira.

# Related posts ("Continue lendo") ranked by shared tags
related:
  includeNewer: true
  threshold: 0
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10
