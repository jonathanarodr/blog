# Hugo configuration file
baseURL: https://www.jonathanarodr.com/
title: Jonathan Rodrigues
defaultContentLanguage: pt
defaultContentLanguageInSubdir: false

# Portuguese at the root, English under /en/
languages:
  pt:
    languageCode: pt-BR
    languageName: Português (Brasil)
    weight: 1
    menus:
      main:
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 1
        - identifier: projects
          name: Showcase
          pageRef: /projects
          weight: 2
        - identifier: about
          name: Sobre
          pageRef: /about
          weight: 3
        - name: GitHub
          weight: 5
          url: "https://github.com/jonathanarodr"
          params:
            icon: github
        - name: LinkedIn
          weight: 6
          url: "https://linkedin.com/in/jonathanarodr"
          params:
            icon: linkedin
  en:
    languageCode: en-US
    languageName: English
    weight: 2
    menus:
      main:
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 1
        - identifier: projects
          name: Showcase
          pageRef: /projects
          weight: 2
        - identifier: about
          name: About
          pageRef: /about
          weight: 3
        - name: GitHub
          weight: 5
          url: "https://github.com/jonathanarodr"
          params:
            icon: github
        - name: LinkedIn
          weight: 6
          url: "https://linkedin.com/in/jonathanarodr"
          params:
            icon: linkedin

# Enable Git info for last modified dates
enableGitInfo: true

# Tags drive the blog hub filter, so no standalone taxonomy pages; no RSS feeds
disableKinds:
  - taxonomy
  - term
  - rss

markup:
  # Allow raw HTML
  goldmark:
    renderer:
      unsafe: true

  # Table of contents on blog posts: h2 and h3 only
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

  # Syntax highlight via CSS classes (assets/css/jr-chroma.css)
  highlight:
    noClasses: false

# Site parameters
params:
  # Author shown on blog posts
  author:
    name: Jonathan Rodrigues
    image: https://github.com/jonathanarodr.png

# Related posts ("Continue lendo") ranked by shared tags
related:
  includeNewer: true
  threshold: 0
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10
